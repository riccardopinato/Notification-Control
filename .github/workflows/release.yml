name: Android Release / Play Internal

on:
  workflow_dispatch:
    inputs:
      publish_play_internal:
        description: 'Upload the exact certified AAB to Google Play Internal Testing'
        required: true
        default: false
        type: boolean
      create_github_prerelease:
        description: 'Create/update the GitHub prerelease for the certified RC'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: notification-control-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || vars.GOOGLE_WEB_CLIENT_ID || '72691779013-hci9cr313a5ado5skdghs6h7a5pg84md.apps.googleusercontent.com' }}
      EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.EXPECTED_UPLOAD_CERT_SHA256 || vars.EXPECTED_UPLOAD_CERT_SHA256 }}

    steps:
      - name: Require current release control plane
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Release workflow must be dispatched from main." >&2
            exit 1
          }

      - name: Checkout release control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          ref: ${{ github.sha }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.3.1'

      - name: Load certified RC binding
        id: cert
        shell: bash
        run: |
          set -euo pipefail
          source control/release/RC_CERTIFICATION.env
          echo "rc_id=$RC_ID" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$CERTIFIED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "RC_ID=$RC_ID" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "CERTIFIED_SOURCE_SHA=$CERTIFIED_SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Verify control-plane static readiness
        run: |
          python3 control/scripts/verify_play_release_readiness.py \
            --control-root control \
            --source-root control

      - name: Checkout exact certified application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.cert.outputs.source_sha }}
          path: source

      - name: Verify exact certified source binding
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(git -C source rev-parse HEAD)"
          [[ "$resolved" == "$CERTIFIED_SOURCE_SHA" ]] || {
            echo "Certified source mismatch: $resolved != $CERTIFIED_SOURCE_SHA" >&2
            exit 1
          }
          mkdir -p release-output
          python3 control/scripts/verify_play_release_readiness.py \
            --control-root control \
            --source-root source \
            --output release-output/PLAY_STATIC_READINESS.txt
          python3 source/scripts/verify_rc_identity.py \
            --properties source/release/RC.properties \
            --output release-output/RC_IDENTITY.txt

      - name: Prepare Android signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${SIGNING_STORE_PASSWORD:-}" && -n "${SIGNING_KEY_ALIAS:-}" && -n "${SIGNING_KEY_PASSWORD:-}" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/source/app/release.keystore"
            echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/source/app/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Distribution preflight
        shell: bash
        run: |
          set -euo pipefail
          real_distribution=false
          if [[ "${{ inputs.publish_play_internal }}" == "true" || "${{ inputs.create_github_prerelease }}" == "true" ]]; then
            real_distribution=true
          fi

          if [[ "$real_distribution" == "true" && "$SIGNING_READY" != "true" ]]; then
            echo "Real distribution requires persistent Android signing credentials." >&2
            exit 1
          fi

          if [[ "${{ inputs.publish_play_internal }}" == "true" ]]; then
            [[ -n "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]] || {
              echo "PLAY_SERVICE_ACCOUNT_JSON is required for Play Internal Testing." >&2
              exit 1
            }
            [[ -n "${EXPECTED_UPLOAD_CERT_SHA256:-}" ]] || {
              echo "EXPECTED_UPLOAD_CERT_SHA256 is required before Play upload." >&2
              exit 1
            }
          fi

      - name: Unit tests on certified source
        working-directory: source
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Release lint on certified source
        working-directory: source
        run: gradle :app:lintRelease --stacktrace --no-daemon

      - name: Build exact release APK and AAB once
        working-directory: source
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Verify release identity, signing and exact artifacts
        shell: bash
        run: |
          set -euo pipefail
          metadata="source/app/build/outputs/apk/release/output-metadata.json"
          apk="$(find source/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          aab="$(find source/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -f "$apk"
          test -f "$aab"

          python3 source/scripts/verify_rc_identity.py \
            --properties source/release/RC.properties \
            --metadata "$metadata" \
            --output release-output/RC_RELEASE_IDENTITY.txt

          cp "$apk" "release-output/${RC_ID}.apk"
          cp "$aab" "release-output/${RC_ID}.aab"
          cp "$metadata" release-output/release-output-metadata.json
          if [[ -f source/app/build/outputs/mapping/release/mapping.txt ]]; then
            cp source/app/build/outputs/mapping/release/mapping.txt release-output/mapping.txt
          fi

          signing_status="UNSIGNED_VALIDATION"
          release_publishable=false
          cert_sha256="NOT_AVAILABLE"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner=""
          if [[ -n "$sdk_root" && -d "$sdk_root/build-tools" ]]; then
            apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1 || true)"
          fi

          if [[ "$SIGNING_READY" == "true" ]]; then
            [[ -n "$apksigner" ]] || {
              echo "apksigner not available." >&2
              exit 1
            }
            "$apksigner" verify "release-output/${RC_ID}.apk"
            jarsigner -verify "release-output/${RC_ID}.aab" >/dev/null
            cert_sha256="$("$apksigner" verify --print-certs "release-output/${RC_ID}.apk" 2>/dev/null \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
            [[ -n "$cert_sha256" ]] || {
              echo "Unable to resolve release certificate SHA-256." >&2
              exit 1
            }
            signing_status="SIGNED"
            release_publishable=true

            if [[ -n "${EXPECTED_UPLOAD_CERT_SHA256:-}" ]]; then
              actual_norm="$(printf '%s' "$cert_sha256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
              expected_norm="$(printf '%s' "$EXPECTED_UPLOAD_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
              [[ "$actual_norm" == "$expected_norm" ]] || {
                echo "Signing certificate mismatch." >&2
                echo "Expected upload cert SHA-256: $EXPECTED_UPLOAD_CERT_SHA256" >&2
                echo "Actual upload cert SHA-256: $cert_sha256" >&2
                exit 1
              }
            fi
          fi

          {
            echo "RC_ID=$RC_ID"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "CONTROL_PLANE_SHA=$GITHUB_SHA"
            echo "CERTIFIED_SOURCE_SHA=$CERTIFIED_SOURCE_SHA"
            echo "RESOLVED_SOURCE_SHA=$(git -C source rev-parse HEAD)"
            echo "PACKAGE_ID=com.riccardopinato.notificationcontrol"
            echo "VARIANT=release"
            echo "RELEASE_BINARY_STATUS=$signing_status"
            echo "RELEASE_PUBLISHABLE=$release_publishable"
            echo "UPLOAD_CERT_SHA256=$cert_sha256"
            echo "APK_SHA256=$(sha256sum "release-output/${RC_ID}.apk" | awk '{print $1}')"
            echo "AAB_SHA256=$(sha256sum "release-output/${RC_ID}.aab" | awk '{print $1}')"
            echo "WORKFLOW_RUN_ID=$GITHUB_RUN_ID"
          } > release-output/RELEASE_PROVENANCE.txt

          echo "RELEASE_BINARY_STATUS=$signing_status" >> "$GITHUB_ENV"
          echo "RELEASE_PUBLISHABLE=$release_publishable" >> "$GITHUB_ENV"
          echo "UPLOAD_CERT_SHA256=$cert_sha256" >> "$GITHUB_ENV"

      - name: Create or update GitHub RC prerelease
        if: inputs.create_github_prerelease == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="rc-v$VERSION_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-output/${RC_ID}.apk release-output/${RC_ID}.aab --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$CERTIFIED_SOURCE_SHA" \
              --title "Notification Control $VERSION_NAME" \
              --prerelease \
              --generate-notes \
              release-output/${RC_ID}.apk \
              release-output/${RC_ID}.aab
          fi

      - name: Upload exact certified AAB to Google Play Internal Testing
        id: play_upload
        if: inputs.publish_play_internal == true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.riccardopinato.notificationcontrol
          releaseFiles: release-output/${{ steps.cert.outputs.rc_id }}.aab
          track: internal
          status: completed

      - name: Finalize release-reality evidence
        shell: bash
        run: |
          set -euo pipefail

          play_upload="NOT_REQUESTED"
          if [[ "${{ inputs.publish_play_internal }}" == "true" ]]; then
            play_upload="SUBMITTED"
          fi

          github_prerelease="NOT_REQUESTED"
          if [[ "${{ inputs.create_github_prerelease }}" == "true" ]]; then
            github_prerelease="CREATED_OR_UPDATED"
          fi

          {
            echo "step27a_automated=PASS"
            echo "step27b_physical_oem=MANUAL_REQUIRED"
            echo "step27c_static_readiness=PASS"
            echo "production_signing=$RELEASE_BINARY_STATUS"
            echo "release_publishable=$RELEASE_PUBLISHABLE"
            echo "upload_cert_sha256=$UPLOAD_CERT_SHA256"
            echo "github_prerelease=$github_prerelease"
            echo "play_internal_upload=$play_upload"
            echo "play_internal_install_update=MANUAL_REQUIRED"
            echo "play_app_signing_fingerprint=EXTERNAL_REQUIRED"
            echo "google_oauth_release_match=EXTERNAL_REQUIRED"
            echo "play_products_activation=EXTERNAL_REQUIRED"
            echo "live_purchase_restore=MANUAL_REQUIRED"
            echo "live_google_profile=MANUAL_REQUIRED"
            echo "distribution_verified=MANUAL_REQUIRED"
            echo "final_v1_certification=BLOCKED_27B_27C_EXTERNAL"
          } > release-output/RELEASE_REALITY_VERDICT.txt

          find release-output -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > release-output/SHA256SUMS.txt
          du -ah release-output | sort -h > release-output/SIZES.txt
          ls -lh release-output

      - name: Upload release-reality evidence and exact artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.cert.outputs.rc_id }}-release-reality
          path: release-output/
          if-no-files-found: error

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f source/app/release.keystore
