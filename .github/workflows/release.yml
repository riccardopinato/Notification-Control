name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (example: 1.0.0)'
        required: true
        type: string
      version_code:
        description: 'Android versionCode'
        required: true
        type: number
      publish_play_internal:
        description: 'Upload AAB to Google Play Internal Testing when credentials exist'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || vars.GOOGLE_WEB_CLIENT_ID || '72691779013-hci9cr313a5ado5skdghs6h7a5pg84md.apps.googleusercontent.com' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "VERSION_NAME=${{ inputs.version_name }}" >> "$GITHUB_ENV"
            echo "VERSION_CODE=${{ inputs.version_code }}" >> "$GITHUB_ENV"
          else
            version="${GITHUB_REF_NAME#v}"
            echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
            echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Prepare Android signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64}" && -n "${SIGNING_STORE_PASSWORD}" && -n "${SIGNING_KEY_ALIAS}" && -n "${SIGNING_KEY_PASSWORD}" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/release.keystore"
            echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/app/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Release lint
        run: gradle :app:lintRelease --stacktrace --no-daemon

      - name: Build release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Collect release outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp {} release-output/ \;
          find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -exec cp {} release-output/ \;
          if [[ -f app/build/outputs/mapping/release/mapping.txt ]]; then
            cp app/build/outputs/mapping/release/mapping.txt release-output/mapping.txt
          fi
          sha256sum release-output/* > release-output/SHA256SUMS.txt
          ls -lh release-output

      - name: Upload release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notification-control-release-${{ env.VERSION_NAME }}
          path: release-output/
          if-no-files-found: error

      - name: Create GitHub Release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "Notification Control $GITHUB_REF_NAME" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-output/* --clobber

      - name: Upload to Google Play Internal Testing
        if: env.SIGNING_READY == 'true' && env.PLAY_SERVICE_ACCOUNT_JSON != '' && (github.event_name == 'push' || inputs.publish_play_internal == true)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.riccardopinato.notificationcontrol
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
