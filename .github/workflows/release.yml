name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (example: 1.0.0)'
        required: true
        type: string
      version_code:
        description: 'Android versionCode'
        required: true
        type: number
      publish_play_internal:
        description: 'Upload AAB to Google Play Internal Testing when credentials exist'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      PLAY_PRODUCTS_READY: ${{ vars.PLAY_PRODUCTS_READY || 'false' }}
      GOOGLE_IDENTITY_ENABLED: ${{ vars.GOOGLE_IDENTITY_ENABLED || 'false' }}
      GOOGLE_OAUTH_READY: ${{ vars.GOOGLE_OAUTH_READY || 'false' }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || vars.GOOGLE_WEB_CLIENT_ID || '72691779013-hci9cr313a5ado5skdghs6h7a5pg84md.apps.googleusercontent.com' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.3.1'

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "VERSION_NAME=${{ inputs.version_name }}" >> "$GITHUB_ENV"
            echo "VERSION_CODE=${{ inputs.version_code }}" >> "$GITHUB_ENV"
          else
            version="${GITHUB_REF_NAME#v}"
            echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
            echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Prepare Android signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64}" && -n "${SIGNING_STORE_PASSWORD}" && -n "${SIGNING_KEY_ALIAS}" && -n "${SIGNING_KEY_PASSWORD}" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/release.keystore"
            echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/app/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Release signing gate
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${SIGNING_READY}" != "true" ]]; then
            echo "Tagged releases require Android signing credentials." >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.publish_play_internal }}" == "true" && "${SIGNING_READY}" != "true" ]]; then
            echo "Google Play publication requires Android signing credentials." >&2
            exit 1
          fi

          if [[ "${SIGNING_READY}" == "true" ]]; then
            echo "RELEASE_KIND=signed" >> "$GITHUB_ENV"
          else
            echo "RELEASE_KIND=unsigned-validation" >> "$GITHUB_ENV"
          fi

      - name: Product readiness gate
        shell: bash
        run: |
          set -euo pipefail

          release_intent=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]] || \
             [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.publish_play_internal }}" == "true" ]]; then
            release_intent=true
          fi

          if [[ "$release_intent" == "true" && "${PLAY_PRODUCTS_READY}" != "true" ]]; then
            echo "Premium Play products/base plans must be configured before a publishable release." >&2
            exit 1
          fi

          if [[ "${GOOGLE_IDENTITY_ENABLED}" == "true" && "${GOOGLE_OAUTH_READY}" != "true" ]]; then
            echo "Google identity is enabled but Android/Play OAuth readiness is not confirmed." >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.publish_play_internal }}" == "true" && -z "${PLAY_SERVICE_ACCOUNT_JSON}" ]]; then
            echo "Play Internal Testing upload requires PLAY_SERVICE_ACCOUNT_JSON." >&2
            exit 1
          fi

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Release lint
        run: gradle :app:lintRelease --stacktrace --no-daemon

      - name: Build release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Verify least-privilege Play manifest
        shell: bash
        run: |
          set -euo pipefail
          release_manifest="$(find app/build/intermediates -type f -name AndroidManifest.xml | grep -E '/release/' | head -n 1)"
          test -n "$release_manifest"
          for permission in \
            android.permission.READ_MEDIA_IMAGES \
            android.permission.READ_MEDIA_VISUAL_USER_SELECTED \
            android.permission.READ_EXTERNAL_STORAGE; do
            if grep -q "$permission" "$release_manifest"; then
              echo "Release contains forbidden broad media permission: $permission" >&2
              exit 1
            fi
          done

      - name: Collect release outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp {} release-output/ \;
          find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -exec cp {} release-output/ \;
          if [[ -f app/build/outputs/mapping/release/mapping.txt ]]; then
            cp app/build/outputs/mapping/release/mapping.txt release-output/mapping.txt
          fi
          {
            echo "release_kind=${RELEASE_KIND}"
            echo "signing_ready=${SIGNING_READY}"
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "commit=${GITHUB_SHA}"
            echo "play_products_ready=${PLAY_PRODUCTS_READY}"
            echo "google_identity_enabled=${GOOGLE_IDENTITY_ENABLED}"
            echo "google_oauth_ready=${GOOGLE_OAUTH_READY}"
          } > release-output/RELEASE_PROVENANCE.txt
          sha256sum release-output/* > release-output/SHA256SUMS.txt
          ls -lh release-output

      - name: Upload release build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notification-control-release-${{ env.VERSION_NAME }}-${{ env.RELEASE_KIND }}
          path: release-output/
          if-no-files-found: error

      - name: Create GitHub Release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "Notification Control $GITHUB_REF_NAME" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-output/* --clobber

      - name: Upload to Google Play Internal Testing
        if: env.SIGNING_READY == 'true' && env.PLAY_SERVICE_ACCOUNT_JSON != '' && (github.event_name == 'push' || inputs.publish_play_internal == true)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.riccardopinato.notificationcontrol
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
