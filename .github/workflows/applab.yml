name: AppLab FULL Runtime Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: notification-control-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  rc-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify App Factory alignment
        run: python3 scripts/verify_factory_alignment.py
      - name: Verify canonical RC identity
        run: python3 scripts/verify_rc_identity.py

  applab-full:
    needs: rc-identity
    uses: riccardopinato/AppLab/.github/workflows/external-native-android-runner.yml@c4333be0bacb2caecade95ae0901f84524a752c6
    with:
      repository: riccardopinato/Notification-Control
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      source_ref: ${{ github.head_ref || github.ref_name }}
      working_directory: "."
      java_version: "21"
      gradle_version: "9.3.1"
      compile_sdk: "36"
      build_tools: "36.0.0"
      test_command: "python3 scripts/verify_rc_identity.py && gradle :app:testDebugUnitTest --stacktrace --no-daemon --max-workers=1"
      lint_command: "gradle :app:lintQaPremium --stacktrace --no-daemon --max-workers=1"
      build_command: "gradle :app:assembleQaPremium --stacktrace --no-daemon --max-workers=1"
      apk_path: "app/build/outputs/apk/qaPremium/app-qaPremium.apk"
      package_id: "com.riccardopinato.notificationcontrol"
      api_level: "35"
      emulator_profile: "pixel_7_pro"
      run_maestro: true
      maestro_flow: ".maestro/applab-full.yaml"
      android_prepare_command: "adb shell pm grant com.riccardopinato.notificationcontrol android.permission.POST_NOTIFICATIONS || true"
      history_key: "notification-control"
      cache_verification: false
      analysis_mode: "full"
