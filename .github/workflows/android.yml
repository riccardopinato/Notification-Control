name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: notification-control-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || vars.GOOGLE_WEB_CLIENT_ID || '72691779013-hci9cr313a5ado5skdghs6h7a5pg84md.apps.googleusercontent.com' }}
      RC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.3.1'
      - name: Load canonical RC identity
        id: rc
        shell: bash
        run: |
          set -euo pipefail
          source release/RC.properties
          echo "id=$RC_ID" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Verify canonical RC identity
        run: python3 scripts/verify_rc_identity.py --output rc-ci-evidence/RC_IDENTITY.txt

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Lint
        shell: bash
        run: |
          set +e
          gradle :app:lintDebug --stacktrace --no-daemon
          status=$?
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            echo "----- FULL LINT REPORT -----"
            cat "$report"
          fi
          exit $status
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Build optimized perfTest APK and benchmark harness
        run: gradle :app:assemblePerfTest :benchmark:assemblePerfTest --stacktrace --no-daemon
      - name: Build QA Premium APK
        run: gradle :app:assembleQaPremium --stacktrace --no-daemon
      - name: Record RC source and validation artifact evidence
        shell: bash
        run: |
          set -euo pipefail
          metadata="app/build/outputs/apk/qaPremium/output-metadata.json"
          python3 scripts/verify_rc_identity.py \
            --metadata "$metadata" \
            --version-suffix=-qa-premium \
            --output rc-ci-evidence/RC_QA_IDENTITY.txt
          cp "$metadata" rc-ci-evidence/qaPremium-output-metadata.json
          {
            echo "source_sha=$RC_SOURCE_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_ref=$GITHUB_REF"
            sha256sum app/build/outputs/apk/debug/app-debug.apk
            sha256sum app/build/outputs/apk/perfTest/app-perfTest.apk
            sha256sum app/build/outputs/apk/qaPremium/app-qaPremium.apk
          } > rc-ci-evidence/RC_SOURCE_AND_ARTIFACTS.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notification-control-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload optimized perfTest APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notification-control-perf-test
          path: app/build/outputs/apk/perfTest/app-perfTest.apk
          if-no-files-found: error
      - name: Upload QA Premium APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notification-control-qa-premium
          path: app/build/outputs/apk/qaPremium/app-qaPremium.apk
          if-no-files-found: error

      - name: Upload RC CI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.rc.outputs.id }}-ci-evidence
          path: rc-ci-evidence/
          if-no-files-found: error
