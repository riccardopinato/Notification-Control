name: Certified QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  certified:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || vars.GOOGLE_WEB_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare evidence directory
        run: mkdir -p certified-evidence

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Release lint
        run: gradle :app:lintRelease --stacktrace --no-daemon

      - name: Build release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Compile performance harness
        run: gradle :app:assemblePerfTest :benchmark:assemblePerfTest --stacktrace --no-daemon

      - name: Build QA Premium validation APK
        run: gradle :app:assembleQaPremium --stacktrace --no-daemon

      - name: Dependency evidence
        shell: bash
        run: |
          gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > certified-evidence/release-dependencies.txt

      - name: Privacy and manifest gates
        shell: bash
        run: |
          set -euo pipefail
          manifest="app/src/main/AndroidManifest.xml"
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          if grep -q 'android.permission.QUERY_ALL_PACKAGES' "$manifest"; then
            echo "QUERY_ALL_PACKAGES must not be used" >&2
            exit 1
          fi
          cp "$manifest" certified-evidence/AndroidManifest.xml

      - name: Localization gates
        shell: bash
        run: |
          set -euo pipefail
          for locale in values values-it values-es values-fr values-pt; do
            test -d "app/src/main/res/$locale"
          done
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("app/src/main/res")
          locales = ["values-it", "values-es", "values-fr", "values-pt"]

          def translatable_strings(folder: Path):
              found = set()
              for file in sorted(folder.glob("*.xml")):
                  try:
                      xml = ET.parse(file).getroot()
                  except ET.ParseError as exc:
                      raise SystemExit(f"Invalid XML: {file}: {exc}")
                  for element in xml:
                      if element.tag != "string":
                          continue
                      if element.attrib.get("translatable", "true") == "false":
                          continue
                      name = element.attrib.get("name")
                      if name:
                          found.add(name)
              return found

          base = translatable_strings(root / "values")
          lines = [f"default_strings={len(base)}"]
          failures = []

          for locale in locales:
              translated = translatable_strings(root / locale)
              missing = sorted(base - translated)
              lines.append(
                  f"{locale}: translated={len(translated)} missing={len(missing)}"
              )
              if missing:
                  lines.extend(f"  MISSING {name}" for name in missing)
                  failures.append((locale, missing))

          Path("certified-evidence/localization-parity.txt").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          if failures:
              for locale, missing in failures:
                  print(f"{locale} missing {len(missing)} strings:")
                  for name in missing:
                      print(f"  {name}")
              raise SystemExit("Localization parity gate failed")
          PY
          cp app/src/main/res/xml/locales_config.xml certified-evidence/locales_config.xml

      - name: Collect automated evidence
        shell: bash
        run: |
          set -euo pipefail
          cp -R app/build/test-results certified-evidence/test-results
          if [[ -d app/build/reports/tests ]]; then
            cp -R app/build/reports/tests certified-evidence/test-reports
          fi
          if [[ -d app/build/reports/lint-results-release.html ]]; then
            cp app/build/reports/lint-results-release.html certified-evidence/
          elif [[ -f app/build/reports/lint-results-release.html ]]; then
            cp app/build/reports/lint-results-release.html certified-evidence/
          fi
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp {} certified-evidence/ \;
          find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -exec cp {} certified-evidence/ \;
          find app/build/outputs/apk/perfTest -maxdepth 1 -type f -name '*.apk' -exec cp {} certified-evidence/ \;
          find app/build/outputs/apk/qaPremium -maxdepth 1 -type f -name '*.apk' -exec cp {} certified-evidence/ \;
          if [[ -f app/build/outputs/mapping/release/mapping.txt ]]; then
            cp app/build/outputs/mapping/release/mapping.txt certified-evidence/mapping.txt
          fi
          {
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "generated_utc=$(date -u +%FT%TZ)"
            echo "automated_gate=PASS"
            echo "device_validation=MANUAL_REQUIRED"
            echo "macrobenchmark_runtime=MANUAL_REQUIRED"
            echo "play_configuration=EXTERNAL_REQUIRED"
            if [[ -n "${GOOGLE_WEB_CLIENT_ID:-}" ]]; then
              echo "google_oauth_configuration=CLIENT_ID_INJECTED"
            else
              echo "google_oauth_configuration=CLIENT_ID_REQUIRED"
            fi
          } > certified-evidence/VERDICT.txt
          find certified-evidence -type f -maxdepth 2 -print0 | sort -z | xargs -0 sha256sum > certified-evidence/SHA256SUMS.txt
          du -ah certified-evidence | sort -h > certified-evidence/SIZES.txt

      - name: Upload Certified Evidence Bundle
        uses: actions/upload-artifact@v4
        with:
          name: notification-control-certified-evidence
          path: certified-evidence/
          if-no-files-found: error
