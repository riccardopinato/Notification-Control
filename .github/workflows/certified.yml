name: Certified QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: notification-control-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certified:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || vars.GOOGLE_WEB_CLIENT_ID || '72691779013-hci9cr313a5ado5skdghs6h7a5pg84md.apps.googleusercontent.com' }}
      RC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.EXPECTED_UPLOAD_CERT_SHA256 || vars.EXPECTED_UPLOAD_CERT_SHA256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.3.1'

      - name: Prepare evidence directory
        run: mkdir -p certified-evidence

      - name: Verify App Factory alignment
        run: |
          python3 scripts/verify_factory_alignment.py \
            --output certified-evidence/FACTORY_ALIGNMENT.txt
          cp release/FACTORY_BASELINE.env certified-evidence/FACTORY_BASELINE.env

      - name: Load canonical RC identity
        id: rc
        shell: bash
        run: |
          set -euo pipefail
          source release/RC.properties
          echo "id=$RC_ID" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Verify canonical RC identity
        run: python3 scripts/verify_rc_identity.py --output certified-evidence/RC_IDENTITY.txt

      - name: Prepare Android signing when credentials exist
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${SIGNING_STORE_PASSWORD:-}" && -n "${SIGNING_KEY_ALIAS:-}" && -n "${SIGNING_KEY_PASSWORD:-}" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/release.keystore"
            echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/app/release.keystore" >> "$GITHUB_ENV"
            echo "CERTIFIED_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "CERTIFIED_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
          fi

      - name: Step 27C static Play/release readiness
        run: |
          python3 scripts/verify_play_release_readiness.py \
            --output certified-evidence/PLAY_STATIC_READINESS.txt

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Release lint
        run: gradle :app:lintRelease --stacktrace --no-daemon

      - name: Build release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Verify built release identity and provenance
        shell: bash
        run: |
          set -euo pipefail
          metadata="app/build/outputs/apk/release/output-metadata.json"
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$apk" && test -f "$apk"
          test -n "$aab" && test -f "$aab"
          python3 scripts/verify_rc_identity.py \
            --metadata "$metadata" \
            --output certified-evidence/RC_RELEASE_IDENTITY.txt
          cp release/RC.properties certified-evidence/RC.properties
          cp "$metadata" certified-evidence/release-output-metadata.json

          signing_status="UNSIGNED_VALIDATION"
          signing_lane="NONE"
          signing_identity_match="EXTERNAL_REQUIRED"
          publishable="false"
          cert_sha256="NOT_AVAILABLE"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner=""
          if [[ -n "$sdk_root" && -d "$sdk_root/build-tools" ]]; then
            apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1 || true)"
          fi

          if [[ "${CERTIFIED_SIGNING_CONFIGURED:-false}" == "true" ]]; then
            [[ -n "$apksigner" ]] || {
              echo "apksigner not available for configured release signing." >&2
              exit 1
            }
            "$apksigner" verify "$apk"
            jarsigner -verify -strict "$aab" >/dev/null
            cert_sha256="$("$apksigner" verify --print-certs "$apk" 2>/dev/null \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
            [[ -n "$cert_sha256" ]] || {
              echo "Unable to resolve release certificate SHA-256." >&2
              exit 1
            }

            signing_status="SIGNED"
            signing_lane="PRODUCTION"

            if [[ -n "${EXPECTED_UPLOAD_CERT_SHA256:-}" ]]; then
              actual_norm="$(printf '%s' "$cert_sha256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
              expected_norm="$(printf '%s' "$EXPECTED_UPLOAD_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
              [[ "$actual_norm" == "$expected_norm" ]] || {
                echo "Certified signing certificate mismatch." >&2
                exit 1
              }
              signing_identity_match="VERIFIED"
              publishable="true"
            fi
          fi

          {
            echo "RELEASE_BINARY_STATUS=$signing_status"
            echo "SIGNING_LANE=$signing_lane"
            echo "SIGNING_IDENTITY_MATCH=$signing_identity_match"
            echo "RELEASE_PUBLISHABLE=$publishable"
            echo "RELEASE_CERT_SHA256=$cert_sha256"
          } > certified-evidence/RELEASE_SIGNING.env

          {
            cat release/RC.properties
            echo "SOURCE_SHA=$RC_SOURCE_SHA"
            echo "WORKFLOW_RUN_ID=$GITHUB_RUN_ID"
            echo "WORKFLOW_REF=$GITHUB_REF"
            echo "WORKFLOW_EVENT=$GITHUB_EVENT_NAME"
            source release/FACTORY_BASELINE.env
            echo "FACTORY_SOURCE_SHA=$FACTORY_SOURCE_SHA"
            echo "FACTORY_MASTER_VERSION=$MASTER_VERSION"
            echo "FACTORY_GOLDEN_INDEX_VERSION=$GOLDEN_INDEX_VERSION"
            echo "FACTORY_CI_RELEASE_GOLDEN_VERSION=$CI_RELEASE_GOLDEN_VERSION"
            echo "RELEASE_BINARY_STATUS=$signing_status"
            echo "SIGNING_LANE=$signing_lane"
            echo "SIGNING_IDENTITY_MATCH=$signing_identity_match"
            echo "RELEASE_PUBLISHABLE=$publishable"
            echo "RELEASE_CERT_SHA256=$cert_sha256"
            echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "AAB_SHA256=$(sha256sum "$aab" | awk '{print $1}')"
          } > certified-evidence/RC_PROVENANCE.txt

      - name: Step 26 binary size budget
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          python3 scripts/verify_size_budget.py \
            --apk "$apk" \
            --aab "$aab" \
            --output certified-evidence/SIZE_BUDGET.txt

      - name: Compile performance harness
        run: gradle :app:assemblePerfTest :benchmark:assemblePerfTest --stacktrace --no-daemon

      - name: Build QA Premium validation APK
        run: gradle :app:assembleQaPremium --stacktrace --no-daemon

      - name: Dependency evidence
        shell: bash
        run: |
          gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > certified-evidence/release-dependencies.txt

      - name: Room schema evidence
        shell: bash
        run: |
          set -euo pipefail
          test -d app/schemas
          test -n "$(find app/schemas -type f -name '*.json' -print -quit)"
          cp -R app/schemas certified-evidence/room-schemas

      - name: Supply-chain provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            source release/FACTORY_BASELINE.env
            echo "commit=$RC_SOURCE_SHA"
            echo "factory_source_sha=$FACTORY_SOURCE_SHA"
            echo "factory_master_version=$MASTER_VERSION"
            echo "factory_golden_index_version=$GOLDEN_INDEX_VERSION"
            echo "factory_ci_release_golden_version=$CI_RELEASE_GOLDEN_VERSION"
            echo "checkout=$CHECKOUT_ACTION_SHA"
            echo "setup_java=cf277c60eb25467037889841efdb72551f06f6c3"
            echo "setup_gradle=ed408507eac070d1f99cc633dbcf757c94c7933a"
            echo "upload_artifact=$UPLOAD_ARTIFACT_ACTION_SHA"
            echo "gradle_distribution=9.3.1"
          } > certified-evidence/CI_PROVENANCE.txt

      - name: Privacy and manifest gates
        shell: bash
        run: |
          set -euo pipefail
          manifest="app/src/main/AndroidManifest.xml"
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          forbidden_permissions=(
            "android.permission.QUERY_ALL_PACKAGES"
            "android.permission.READ_CALL_LOG"
            "android.permission.RECEIVE_SMS"
            "android.permission.MANAGE_EXTERNAL_STORAGE"
          )
          for permission in "${forbidden_permissions[@]}"; do
            if grep -q "$permission" "$manifest"; then
              echo "$permission must not be used without an explicit reviewed product requirement" >&2
              exit 1
            fi
          done
          cp "$manifest" certified-evidence/AndroidManifest.xml

      - name: Release media policy and Premium plan gates
        shell: bash
        run: |
          set -euo pipefail
          merged_manifest="$(find app/build/intermediates -type f -name AndroidManifest.xml \
            | grep -E '/(merged_manifest|merged_manifests)/.*release' \
            | head -n 1 || true)"
          test -n "$merged_manifest"
          test -f "$merged_manifest"

          forbidden_release_media_permissions=(
            "android.permission.READ_MEDIA_IMAGES"
            "android.permission.READ_MEDIA_VISUAL_USER_SELECTED"
            "android.permission.READ_EXTERNAL_STORAGE"
          )
          for permission in "${forbidden_release_media_permissions[@]}"; do
            if grep -q "$permission" "$merged_manifest"; then
              echo "Public release must remain least-privilege until Play broad-media eligibility is approved: $permission" >&2
              exit 1
            fi
          done

          grep -q 'PREMIUM_SUBSCRIPTION = "notification_control_premium"' \
            app/src/main/java/com/riccardopinato/notificationcontrol/billing/BillingProducts.kt
          grep -q 'PREMIUM_MONTHLY_BASE_PLAN = "monthly"' \
            app/src/main/java/com/riccardopinato/notificationcontrol/billing/BillingProducts.kt
          grep -q 'PREMIUM_ANNUAL_BASE_PLAN = "annual"' \
            app/src/main/java/com/riccardopinato/notificationcontrol/billing/BillingProducts.kt

          {
            echo "release_media_policy=NOTIFICATION_PLUS_SAF_LEAST_PRIVILEGE"
            echo "broad_mediastore_release=DISABLED_PENDING_PLAY_REVIEW"
            echo "premium_subscription_product=notification_control_premium"
            echo "premium_monthly_base_plan=monthly"
            echo "premium_annual_base_plan=annual"
            echo "oauth_android_signing_match=EXTERNAL_REQUIRED"
            echo "play_product_activation=EXTERNAL_REQUIRED"
          } > certified-evidence/PLAY_READINESS.txt
          cp "$merged_manifest" certified-evidence/AndroidManifest-release-merged.xml

      - name: Localization gates
        shell: bash
        run: |
          set -euo pipefail
          for locale in values values-it values-es values-fr values-pt; do
            test -d "app/src/main/res/$locale"
          done
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("app/src/main/res")
          locales = ["values-it", "values-es", "values-fr", "values-pt"]

          def translatable_strings(folder: Path):
              found = set()
              for file in sorted(folder.glob("*.xml")):
                  try:
                      xml = ET.parse(file).getroot()
                  except ET.ParseError as exc:
                      raise SystemExit(f"Invalid XML: {file}: {exc}")
                  for element in xml:
                      if element.tag != "string":
                          continue
                      if element.attrib.get("translatable", "true") == "false":
                          continue
                      name = element.attrib.get("name")
                      if name:
                          found.add(name)
              return found

          base = translatable_strings(root / "values")
          lines = [f"default_strings={len(base)}"]
          failures = []

          for locale in locales:
              translated = translatable_strings(root / locale)
              missing = sorted(base - translated)
              lines.append(
                  f"{locale}: translated={len(translated)} missing={len(missing)}"
              )
              if missing:
                  lines.extend(f"  MISSING {name}" for name in missing)
                  failures.append((locale, missing))

          Path("certified-evidence/localization-parity.txt").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          if failures:
              for locale, missing in failures:
                  print(f"{locale} missing {len(missing)} strings:")
                  for name in missing:
                      print(f"  {name}")
              raise SystemExit("Localization parity gate failed")
          PY
          cp app/src/main/res/xml/locales_config.xml certified-evidence/locales_config.xml

      - name: Collect automated evidence
        shell: bash
        run: |
          set -euo pipefail
          cp -R app/build/test-results certified-evidence/test-results
          if [[ -d app/build/reports/tests ]]; then
            cp -R app/build/reports/tests certified-evidence/test-reports
          fi
          if [[ -d app/build/reports/lint-results-release.html ]]; then
            cp app/build/reports/lint-results-release.html certified-evidence/
          elif [[ -f app/build/reports/lint-results-release.html ]]; then
            cp app/build/reports/lint-results-release.html certified-evidence/
          fi
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp {} certified-evidence/ \;
          find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -exec cp {} certified-evidence/ \;
          find app/build/outputs/apk/perfTest -maxdepth 1 -type f -name '*.apk' -exec cp {} certified-evidence/ \;
          find app/build/outputs/apk/qaPremium -maxdepth 1 -type f -name '*.apk' -exec cp {} certified-evidence/ \;
          if [[ -f app/build/outputs/mapping/release/mapping.txt ]]; then
            cp app/build/outputs/mapping/release/mapping.txt certified-evidence/mapping.txt
          fi
          source certified-evidence/RELEASE_SIGNING.env
          {
            echo "commit=$RC_SOURCE_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "generated_utc=$(date -u +%FT%TZ)"
            echo "automated_gate=PASS"
            echo "step27a_rc_id=${{ steps.rc.outputs.id }}"
            echo "step27a_rc_source_sha=$RC_SOURCE_SHA"
            echo "step27a_certified_source_gate=PASS"
            echo "step27c_static_readiness=PASS"
            echo "step27c_distribution=EXTERNAL_REQUIRED"
            echo "release_binary_status=$RELEASE_BINARY_STATUS"
            echo "signing_lane=$SIGNING_LANE"
            echo "signing_identity_match=$SIGNING_IDENTITY_MATCH"
            echo "release_publishable=$RELEASE_PUBLISHABLE"
            echo "release_cert_sha256=$RELEASE_CERT_SHA256"
            echo "factory_alignment=PASS"
            echo "device_validation=MANUAL_REQUIRED"
            echo "applab_runtime=SEPARATE_REQUIRED_GATE"
            echo "macrobenchmark_runtime=MANUAL_REQUIRED"
            echo "step26_size_budget=PASS"
            echo "step26_hot_path_profile=UNIT_TESTED"
            echo "step26_long_run_device=MANUAL_REQUIRED"
            echo "play_configuration=EXTERNAL_REQUIRED"
            if [[ -n "${GOOGLE_WEB_CLIENT_ID:-}" ]]; then
              echo "google_oauth_configuration=CLIENT_ID_INJECTED"
            else
              echo "google_oauth_configuration=CLIENT_ID_REQUIRED"
            fi
          } > certified-evidence/VERDICT.txt
          find certified-evidence -maxdepth 2 -type f \
            ! -name 'SHA256SUMS.txt' ! -name 'SIZES.txt' \
            -print0 | sort -z | xargs -0 sha256sum > certified-evidence/SHA256SUMS.txt
          du -ah certified-evidence | sort -h > certified-evidence/SIZES.txt

      - name: Upload Certified Evidence Bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.rc.outputs.id }}-certified-evidence
          path: certified-evidence/
          if-no-files-found: error

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f app/release.keystore
