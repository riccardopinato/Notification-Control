name: Verify Notification Control Signing

on:
  push:
    branches:
      - verify-signing-20261010
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-control-signing-verification
  cancel-in-progress: true

jobs:
  verify-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CONTROL_PLANE_SHA: a233476455c48df06ef52f1eb02c28833369e344
      CERTIFIED_SOURCE_SHA: 3ff070fc3bb2b2122a2982c0eb449e3bd0eb7cb2
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.EXPECTED_UPLOAD_CERT_SHA256 }}

    steps:
      - name: Checkout current control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CONTROL_PLANE_SHA }}
          path: control

      - name: Checkout exact certified RC1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CERTIFIED_SOURCE_SHA }}
          path: source

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.3.1'

      - name: Require all five signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "${SIGNING_STORE_PASSWORD:-}" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "${SIGNING_KEY_ALIAS:-}" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "${SIGNING_KEY_PASSWORD:-}" ]] || missing+=(ANDROID_KEY_PASSWORD)
          [[ -n "${EXPECTED_UPLOAD_CERT_SHA256:-}" ]] || missing+=(EXPECTED_UPLOAD_CERT_SHA256)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required repository secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Verify Factory and RC bindings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 control/scripts/verify_factory_alignment.py \
            --root control \
            --output evidence/FACTORY_ALIGNMENT.txt
          python3 control/scripts/verify_play_release_readiness.py \
            --control-root control \
            --source-root source \
            --output evidence/PLAY_STATIC_READINESS.txt
          python3 source/scripts/verify_rc_identity.py \
            --properties source/release/RC.properties \
            --output evidence/RC_IDENTITY.txt
          resolved="$(git -C source rev-parse HEAD)"
          [[ "$resolved" == "$CERTIFIED_SOURCE_SHA" ]]

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/source/app/release.keystore"
          chmod 600 "$GITHUB_WORKSPACE/source/app/release.keystore"
          echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/source/app/release.keystore" >> "$GITHUB_ENV"

      - name: Unit tests
        working-directory: source
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Release lint
        working-directory: source
        run: gradle :app:lintRelease --stacktrace --no-daemon

      - name: Build signed exact RC1 APK and AAB
        working-directory: source
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Verify certificate, identity and artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find source/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          aab="$(find source/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          metadata="source/app/build/outputs/apk/release/output-metadata.json"
          test -f "$apk"
          test -f "$aab"

          python3 source/scripts/verify_rc_identity.py \
            --properties source/release/RC.properties \
            --metadata "$metadata" \
            --output evidence/RC_RELEASE_IDENTITY.txt

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"

          "$apksigner" verify "$apk"
          jarsigner -verify -verbose -certs "$aab" >/dev/null

          cert_sha256="$("$apksigner" verify --print-certs "$apk" 2>/dev/null \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$cert_sha256"

          actual_norm="$(printf '%s' "$cert_sha256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected_norm="$(printf '%s' "$EXPECTED_UPLOAD_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$actual_norm" == "$expected_norm" ]] || {
            echo "Signing certificate mismatch." >&2
            exit 1
          }

          mkdir -p signed-output
          cp "$apk" signed-output/notification-control-v1.0.0-rc1.apk
          cp "$aab" signed-output/notification-control-v1.0.0-rc1.aab
          cp "$metadata" evidence/release-output-metadata.json

          {
            echo "VERDICT=PASS"
            echo "RC_ID=notification-control-v1.0.0-rc1"
            echo "VERSION_NAME=1.0.0-rc1"
            echo "VERSION_CODE=1000001"
            echo "CONTROL_PLANE_SHA=$CONTROL_PLANE_SHA"
            echo "CERTIFIED_SOURCE_SHA=$CERTIFIED_SOURCE_SHA"
            echo "PACKAGE_ID=com.riccardopinato.notificationcontrol"
            echo "RELEASE_BINARY_STATUS=SIGNED"
            echo "SIGNING_LANE=PRODUCTION"
            echo "SIGNING_IDENTITY_MATCH=VERIFIED"
            echo "RELEASE_PUBLISHABLE=true"
            echo "UPLOAD_CERT_SHA256=$cert_sha256"
            echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "AAB_SHA256=$(sha256sum "$aab" | awk '{print $1}')"
          } > evidence/SIGNING_VERDICT.env

          sha256sum signed-output/* > evidence/SHA256SUMS.txt
          cat evidence/SIGNING_VERDICT.env

      - name: Upload signed RC1 verification bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: notification-control-rc1-signed-verification
          path: |
            signed-output/
            evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f source/app/release.keystore
