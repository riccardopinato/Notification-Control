name: Verify Notification Control Signing

on:
  push:
    branches:
      - verify-signing-20261010
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-control-signing-verification
  cancel-in-progress: true

jobs:
  verify-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CONTROL_PLANE_SHA: a233476455c48df06ef52f1eb02c28833369e344
      CERTIFIED_SOURCE_SHA: 3ff070fc3bb2b2122a2982c0eb449e3bd0eb7cb2
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.EXPECTED_UPLOAD_CERT_SHA256 }}

    steps:
      - name: Checkout current control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CONTROL_PLANE_SHA }}
          path: control

      - name: Checkout exact certified RC1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CERTIFIED_SOURCE_SHA }}
          path: source

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.3.1'

      - name: Require all five signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "${SIGNING_STORE_PASSWORD:-}" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "${SIGNING_KEY_ALIAS:-}" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "${SIGNING_KEY_PASSWORD:-}" ]] || missing+=(ANDROID_KEY_PASSWORD)
          [[ -n "${EXPECTED_UPLOAD_CERT_SHA256:-}" ]] || missing+=(EXPECTED_UPLOAD_CERT_SHA256)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required repository secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Verify Factory and RC bindings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 control/scripts/verify_factory_alignment.py \
            --root control \
            --output evidence/FACTORY_ALIGNMENT.txt
          python3 control/scripts/verify_play_release_readiness.py \
            --control-root control \
            --source-root source \
            --output evidence/PLAY_STATIC_READINESS.txt
          python3 source/scripts/verify_rc_identity.py \
            --properties source/release/RC.properties \
            --output evidence/RC_IDENTITY.txt
          resolved="$(git -C source rev-parse HEAD)"
          [[ "$resolved" == "$CERTIFIED_SOURCE_SHA" ]]

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/source/app/release.keystore"
          chmod 600 "$GITHUB_WORKSPACE/source/app/release.keystore"
          echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/source/app/release.keystore" >> "$GITHUB_ENV"

      - name: Verify reconstructed GitHub keystore identity
        shell: bash
        env:
          CANONICAL_KEYSTORE_FILE_SHA256: 'dc0418e6fc5c0409e072b48f728e52ebf8827f225e40438b86ec6de1e8b8b290'
          CANONICAL_UPLOAD_CERT_SHA256: 'AA:9A:47:C3:99:32:87:CC:32:A3:A2:B0:69:E6:B1:A2:A9:57:BB:EB:9E:A5:BD:BF:EB:D3:44:B3:8C:38:FA:3A'
        run: |
          set -euo pipefail
          keystore="$GITHUB_WORKSPACE/source/app/release.keystore"
          actual_file_sha256="$(sha256sum "$keystore" | awk '{print $1}')"

          cert_output="$(keytool -list -v \
            -keystore "$keystore" \
            -alias "$SIGNING_KEY_ALIAS" \
            -storepass "$SIGNING_STORE_PASSWORD" 2>&1)"
          actual_cert_sha256="$(printf '%s\n' "$cert_output" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"

          normalize() {
            printf '%s' "$1" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'
          }

          file_match=false
          cert_match=false
          [[ "$actual_file_sha256" == "$CANONICAL_KEYSTORE_FILE_SHA256" ]] && file_match=true
          [[ "$(normalize "$actual_cert_sha256")" == "$(normalize "$CANONICAL_UPLOAD_CERT_SHA256")" ]] && cert_match=true

          echo "decoded_keystore_file_sha256=$actual_file_sha256"
          echo "canonical_keystore_file_match=$file_match"
          echo "canonical_upload_certificate_match=$cert_match"

          secret_norm="$(normalize "$EXPECTED_UPLOAD_CERT_SHA256")"
          canonical_secret_norm="$(normalize "$CANONICAL_UPLOAD_CERT_SHA256")"
          expected_secret_match=false
          [[ "$secret_norm" == "$canonical_secret_norm" ]] && expected_secret_match=true
          echo "expected_upload_cert_secret_match=$expected_secret_match"

          if [[ "$expected_secret_match" != "true" ]]; then
            echo "EXPECTED_UPLOAD_CERT_SHA256 is present but does not contain the canonical Notification Control SHA-256 certificate fingerprint." >&2
            exit 1
          fi

          if [[ "$file_match" != "true" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 reconstructs a different .jks than the canonical Notification Control upload key." >&2
            exit 1
          fi

          if [[ "$cert_match" != "true" ]]; then
            echo "The alias selected in the reconstructed keystore does not match the canonical Notification Control upload certificate." >&2
            exit 1
          fi

      - name: Unit tests
        working-directory: source
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Release lint
        working-directory: source
        run: gradle :app:lintRelease --stacktrace --no-daemon

      - name: Build signed exact RC1 APK and AAB
        working-directory: source
        run: gradle :app:clean :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon --no-build-cache --rerun-tasks

      - name: Verify certificate, identity and artifacts
        shell: bash
        env:
          CANONICAL_UPLOAD_CERT_SHA256: 'AA:9A:47:C3:99:32:87:CC:32:A3:A2:B0:69:E6:B1:A2:A9:57:BB:EB:9E:A5:BD:BF:EB:D3:44:B3:8C:38:FA:3A'
        run: |
          set -euo pipefail
          apk="$(find source/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          aab="$(find source/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          metadata="source/app/build/outputs/apk/release/output-metadata.json"
          test -f "$apk"
          test -f "$aab"

          python3 source/scripts/verify_rc_identity.py \
            --properties source/release/RC.properties \
            --metadata "$metadata" \
            --output evidence/RC_RELEASE_IDENTITY.txt
          echo "RC release identity: PASS"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [[ -n "$apksigner" ]] || {
            echo "apksigner not found" >&2
            exit 1
          }

          "$apksigner" verify "$apk"
          echo "APK signature verification: PASS"

          if ! jarsigner -verify -verbose -certs "$aab" > evidence/AAB_JARSIGNER.txt 2>&1; then
            echo "AAB signature verification: FAIL" >&2
            tail -n 40 evidence/AAB_JARSIGNER.txt >&2
            exit 1
          fi
          if grep -Fqi "jar is unsigned" evidence/AAB_JARSIGNER.txt || ! grep -Fqi "jar verified" evidence/AAB_JARSIGNER.txt; then
            echo "AAB signature verification: FAIL (not verifiably signed)" >&2
            tail -n 40 evidence/AAB_JARSIGNER.txt >&2
            exit 1
          fi
          echo "AAB signature verification: PASS"

          "$apksigner" verify --print-certs "$apk" > evidence/APK_CERT_INFO.txt
          cert_sha256="$(awk -F': ' '/certificate SHA-256 digest:/ {print $2; exit}' evidence/APK_CERT_INFO.txt)"
          echo "APK certificate SHA-256 (may be masked if equal to repository secret): $cert_sha256"
          [[ -n "$cert_sha256" ]] || {
            echo "Could not extract APK signing SHA-256" >&2
            cat evidence/APK_CERT_INFO.txt >&2
            exit 1
          }

          normalize() {
            printf '%s' "$1" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'
          }

          actual_norm="$(normalize "$cert_sha256")"
          canonical_norm="$(normalize "$CANONICAL_UPLOAD_CERT_SHA256")"
          secret_norm="$(normalize "$EXPECTED_UPLOAD_CERT_SHA256")"

          [[ "$actual_norm" == "$canonical_norm" ]] || {
            echo "Actual APK signing certificate does not match canonical upload certificate." >&2
            exit 1
          }
          echo "Actual APK certificate = canonical upload certificate: PASS"

          [[ "$secret_norm" == "$canonical_norm" ]] || {
            echo "EXPECTED_UPLOAD_CERT_SHA256 secret does not match canonical upload certificate." >&2
            exit 1
          }
          echo "EXPECTED_UPLOAD_CERT_SHA256 secret = canonical upload certificate: PASS"

          mkdir -p signed-output
          cp "$apk" signed-output/notification-control-v1.0.0-rc1.apk
          cp "$aab" signed-output/notification-control-v1.0.0-rc1.aab
          cp "$metadata" evidence/release-output-metadata.json

          {
            echo "VERDICT=PASS"
            echo "RC_ID=notification-control-v1.0.0-rc1"
            echo "VERSION_NAME=1.0.0-rc1"
            echo "VERSION_CODE=1000001"
            echo "CONTROL_PLANE_SHA=$CONTROL_PLANE_SHA"
            echo "CERTIFIED_SOURCE_SHA=$CERTIFIED_SOURCE_SHA"
            echo "PACKAGE_ID=com.riccardopinato.notificationcontrol"
            echo "RELEASE_BINARY_STATUS=SIGNED"
            echo "SIGNING_LANE=PRODUCTION"
            echo "SIGNING_IDENTITY_MATCH=VERIFIED"
            echo "RELEASE_PUBLISHABLE=true"
            echo "UPLOAD_CERT_SHA256=$cert_sha256"
            echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "AAB_SHA256=$(sha256sum "$aab" | awk '{print $1}')"
          } > evidence/SIGNING_VERDICT.env

          sha256sum signed-output/* > evidence/SHA256SUMS.txt
          cat evidence/SIGNING_VERDICT.env

      - name: Upload signed RC1 verification bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: notification-control-rc1-signed-verification
          path: |
            signed-output/
            evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f source/app/release.keystore
